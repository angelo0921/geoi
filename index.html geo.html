<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Rosales National High School</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <link href="auth.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <div class="form-header">
                <img src="C:\Users\63949\Downloads\487837375_635446992626413_2228603972427441534_n.jpg" alt="School Logo" class="logo">
                <h2>Create Account</h2>
                <p>Join Rosales National High School</p>
            </div>
            
            <form id="registrationForm" onsubmit="return validateForm(this)">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"> <required>
                </div>

                <div class="form-group">
                    <label for="strand">Select Strand</label>
                    <select id="strand" name="strand" required>
                        <option value="">Choose your strand</option>
                        <option value="STEM">STEM</option>
                        <option value="HUMSS">HUMSS</option>
                        <option value="ABM">ABM</option>
                        <option value="GAS">GAS</option>
                        <option value="TVL">TVL</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"><required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"> <required>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <div class="form-footer">
              <style>
                a[href="/index.html"] {
                  background-color: blue;
                 color: white;
                 padding: 10px 20px;
                  border-radius: 5px;
                 }
              </style>
                <a href="C:\Users\63949\Downloads\body.html">   Login here</a></p>
            </div>
        </div>
    </div>
    <style>
      .auth-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f4f4f4;
}

.auth-form {
  background: white;
  padding: 2.5rem;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  width: 100%;
  max-width: 400px;
  animation: slideUp 0.5s ease;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.auth-form input {
  transition: var(--transition);
}

.auth-form input:focus {
  border-color: var(--accent-color);
  outline: none;
  box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
}

.auth-form button {
  transition: var(--transition);
}

.auth-form button:hover {
  background: var(--accent-color);
  transform: translateY(-2px);
}

.auth-form h2 {
  text-align: center;
  color: #003366;
  margin-bottom: 1.5rem;
}

.form-header {
  text-align: center;
  margin-bottom: 2rem;
}

.form-header .logo {
  width: 80px;
  height: 80px;
  margin-bottom: 1rem;
}

.form-header p {
  color: #666;
  margin-top: 0.5rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #333;
  font-weight: 500;
}

.auth-form input,
.auth-form select {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 2px solid #eee;
  border-radius: 8px;
  font-size: 1rem;
  transition: all 0.3s ease;
  border-radius: 8px;
  font-size: 1rem;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.9);
}

.auth-form input:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
}

.submit-btn {
  width: 100%;
  padding: 1rem;
  background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.auth-form button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
}

.auth-form button:active {
  transform: translateY(0);
}

.auth-form p {
  text-align: center;
  margin-top: 1rem;
}

.auth-form a {
  color: #003366;
  text-decoration: none;
}

.hidden {
  display: none;
}
    </style>
</body>
</html>
